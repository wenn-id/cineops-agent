name: cineops

services:
  simulator:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["node", "simulator/index.mjs"]
    environment:
      SCENARIO: premiere-night
      METRICS_PORT: "9100"
      LOKI_URL: http://loki:3100
      TICK_MS: "3000"
      TICK_SECONDS: "45"

  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      SIMULATOR_URL: http://simulator:9100
      SIMULATOR_SCENARIO: premiere-night
    ports:
      - "8080:8080"
    depends_on:
      - simulator

  prometheus:
    image: prom/prometheus:v3.4.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.5.2
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./loki-config.yml:/etc/loki/loki-config.yml:ro
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: cineops
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
